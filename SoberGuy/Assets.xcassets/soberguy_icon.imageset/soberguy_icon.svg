<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6A828"/>
      <stop offset="100%" stop-color="#C9711A"/>
    </linearGradient>
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDF3DD"/>
    </linearGradient>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
    <clipPath id="mugClip">
      <path d="M186 176
               L326 176
               L326 372
               Q326 400 298 400
               L214 400
               Q186 400 186 372
               Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#roundedSquare)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

    <!-- subtle background dot pattern for texture -->
    <g opacity="0.08" fill="#FFFFFF">
      <circle cx="70" cy="90" r="6"/>
      <circle cx="440" cy="120" r="8"/>
      <circle cx="60" cy="430" r="5"/>
      <circle cx="450" cy="420" r="7"/>
      <circle cx="90" cy="250" r="4"/>
    </g>

    <!-- Handle (behind mug body) -->
    <path d="M326 216
             Q384 216 384 268
             Q384 320 326 320"
          fill="none" stroke="#FFF7E8" stroke-width="20" stroke-linecap="round"/>

    <!-- Mug body (two-tone split = splitting the tab) -->
    <g clip-path="url(#mugClip)">
      <rect x="186" y="176" width="70" height="224" fill="#FFFFFF"/>
      <rect x="256" y="176" width="70" height="224" fill="#FDEFD2"/>
      <!-- divider line -->
      <rect x="253" y="176" width="6" height="224" fill="#E8B559"/>
    </g>
    <path d="M186 176
             L326 176
             L326 372
             Q326 400 298 400
             L214 400
             Q186 400 186 372
             Z"
          fill="none" stroke="#8A4B12" stroke-width="6"/>

    <!-- horizontal fill lines inside mug for a clean liquid-line detail -->
    <g clip-path="url(#mugClip)" opacity="0.35" stroke="#C9711A" stroke-width="4">
      <line x1="186" y1="330" x2="326" y2="330"/>
    </g>

    <!-- Foam -->
    <path d="M176 176
             Q176 146 202 144
             Q208 122 232 126
             Q244 108 266 118
             Q288 106 302 126
             Q326 124 330 148
             Q340 152 336 176
             Z"
          fill="url(#foamGrad)" stroke="#8A4B12" stroke-width="6" stroke-linejoin="round"/>

    <!-- foam bubbles -->
    <circle cx="210" cy="150" r="6" fill="#F6A828" opacity="0.5"/>
    <circle cx="256" cy="136" r="7" fill="#F6A828" opacity="0.5"/>
    <circle cx="300" cy="148" r="5" fill="#F6A828" opacity="0.5"/>
  </g>
</svg>
